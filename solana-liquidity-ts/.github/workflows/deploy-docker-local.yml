name: Deploy with Local Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npm run db:generate
    
    - name: Build application
      run: npm run build
    
    - name: Build Docker image
      run: docker build -t solana-liquidity-ts:${{ github.sha }} .
    
    - name: Save Docker image
      run: docker save solana-liquidity-ts:${{ github.sha }} | gzip > image.tar.gz
    
    - name: Upload Docker image
      uses: actions/upload-artifact@v3
      with:
        name: docker-image
        path: image.tar.gz
        retention-days: 7
    
    - name: Deploy to local server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Останавливаем текущие контейнеры
          cd /opt/solana-liquidity-ts
          docker-compose down || true
          
          # Создаем backup
          if [ -f "docker-compose.yml" ]; then
            cp docker-compose.yml docker-compose.backup.yml
          fi
    
    - name: Upload Docker image to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        source: "image.tar.gz"
        target: "/opt/solana-liquidity-ts/"
    
    - name: Load and run Docker image
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd /opt/solana-liquidity-ts
          
          # Загружаем Docker образ
          docker load < image.tar.gz
          
          # Обновляем docker-compose.yml с новым образом
          sed -i "s|image:.*|image: solana-liquidity-ts:${{ github.sha }}|" docker-compose.yml
          
          # Запускаем контейнеры
          docker-compose up -d
          
          # Проверяем статус
          docker-compose ps
          
          # Проверяем здоровье API
          sleep 15
          curl -f http://localhost:3000/api/v1/pools/health || exit 1
          
          echo "✅ Docker deployment completed successfully!"
